name: Update app descriptions

on:
  repository_dispatch:
    types: [apps-updated]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate app descriptions
        env:
          APPS_REF: ${{ github.event.client_payload.sha || 'main' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run sync:app-descriptions
      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/update-app-descriptions
          commit-message: Update app descriptions from badger/home READMEs
          title: Update app descriptions from badger/home READMEs
          body: Regenerated `src/data/app-descriptions.json` from the first sentence of each app README in badger/home.
          add-paths: src/data/app-descriptions.json
