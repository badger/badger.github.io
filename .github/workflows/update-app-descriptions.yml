name: Update app descriptions

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate app descriptions
        env:
          APPS_REF: main
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run sync:app-descriptions
      # PRs created with GITHUB_TOKEN do not trigger ci.yml, so validate here.
      - name: Install dependencies
        run: npm ci
      - name: Check app description updates
        run: npm run test:app-descriptions
      - name: Build
        run: npm run build
      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/update-app-descriptions
          commit-message: Update app descriptions from badger/home READMEs
          title: Update app descriptions from badger/home READMEs
          body: Regenerated `src/data/app-descriptions.json` from the first sentence of each app README in badger/home.
          add-paths: src/data/app-descriptions.json
