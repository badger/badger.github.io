name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check app description updates
        run: npm run test:app-descriptions
      - name: Check app catalog updates
        run: npm run test:app-catalog
      - name: Check editor projects
        run: npm run test:editor
      - name: Build
        run: npm run build
