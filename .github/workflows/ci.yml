name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - site_url: https://badger.github.io
            base_path: /
          - site_url: https://example.github.io
            base_path: /badger.github.io/
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check app description updates
        run: npm run test:app-descriptions
      - name: Check editor projects
        run: npm run test:editor
      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ matrix.site_url }}
          BASE_PATH: ${{ matrix.base_path }}
      - name: Verify built site URLs
        run: node scripts/verify-site-paths.mjs "${{ matrix.base_path }}" "${{ matrix.site_url }}"
